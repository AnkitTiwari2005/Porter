# Serves the built web app and proxies /api to the API container on ONE origin,
# so session cookies stay first-party and no CORS is needed.
# TLS is expected to terminate in front of this (cloud load balancer, Caddy, Cloudflare...).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;


  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Server-Sent Events (live tracking) must not be buffered or cut off.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    client_max_body_size 1m;
  }

  # Hashed build assets can be cached forever; the HTML shell must always be revalidated.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/security-headers.conf; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }
}
