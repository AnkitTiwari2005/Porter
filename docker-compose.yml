# Local production-like stack:  cp server/.env.example server/.env  (edit)  &&  docker compose up --build
# Web on http://localhost:8080, API behind it at /api. For real deployments set secrets via your platform, not this file.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: portex
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U portex"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://portex:${POSTGRES_PASSWORD}@db:5432/portex
      AUTO_MIGRATE: "true"
      TRUST_PROXY: "1"
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    ports: ["8080:8080"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  dbdata:
