name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npm run lint
        working-directory: server
      - name: Tests on real PostgreSQL
        run: npm test
        working-directory: server
        env: { TEST_DATABASE_URL: 'postgres://postgres:pw@localhost:5432/postgres' }
      - name: Tests on in-process Postgres
        run: npm test
        working-directory: server

  docker:
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t portex-api .
      - run: docker build -f Dockerfile.web -t portex-web .
